<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>С Днём Рождения, Соня!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-family: 'Comic Sans MS', sans-serif;
      padding: 0;
      background: radial-gradient(circle at 50% 50%, #4a148c 0%, #1a0033 70%, #0a0015 100%);
      position: relative;
    }

    /* Настоящие пятиконечные звёзды по всему экрану */
    .star {
      position: absolute;
      width: 0px;
      height: 0px;
      border-right: 10px solid transparent;
      border-bottom: 7px solid #ffe600;
      border-left: 10px solid transparent;
      transform: rotate(35deg);
      pointer-events: none;
      filter: drop-shadow(0 0 10px #ffe600);
      animation: floatStar 3.5s infinite ease-in-out;
      opacity: 0.85;
      z-index: 2;
    }
    .star:before {
      border-bottom: 8px solid #ffe600;
      border-left: 3px solid transparent;
      border-right: 3px solid transparent;
      position: absolute;
      height: 0; width: 0;
      top: -5px; left: -6px;
      content: '';
      transform: rotate(-35deg);
    }
    .star:after {
      position: absolute;
      display: block;
      color: #ffe600;
      top: 0px; left: -10.5px;
      width: 0px; height: 0px;
      border-right: 10px solid transparent;
      border-bottom: 7px solid #ffe600;
      border-left: 10px solid transparent;
      transform: rotate(-70deg);
      content: '';
    }

    .st1  { top: 5%;  left: 10%; animation-duration: 3.0s; }
    .st2  { top: 8%;  left: 80%; animation-duration: 4.2s; animation-delay: 0.5s; }
    .st3  { top: 18%; left: 45%; animation-duration: 3.5s; animation-delay: 1.2s; }
    .st4  { top: 22%; left: 88%; animation-duration: 2.8s; animation-delay: 0.2s; }
    .st5  { top: 28%; left: 12%; animation-duration: 4.0s; animation-delay: 1.5s; }
    .st6  { top: 38%; left: 75%; animation-duration: 3.2s; animation-delay: 0.8s; }
    .st7  { top: 42%; left: 20%; animation-duration: 4.5s; animation-delay: 0.3s; }
    .st8  { top: 50%; left: 85%; animation-duration: 3.1s; animation-delay: 1.1s; }
    .st9  { top: 55%; left: 8%;  animation-duration: 3.7s; animation-delay: 0.7s; }
    .st10 { top: 62%; left: 68%; animation-duration: 2.9s; animation-delay: 1.4s; }
    .st11 { top: 70%; left: 25%; animation-duration: 4.1s; animation-delay: 0.4s; }
    .st12 { top: 75%; left: 82%; animation-duration: 3.4s; animation-delay: 1.0s; }
    .st13 { top: 82%; left: 15%; animation-duration: 3.8s; animation-delay: 0.6s; }
    .st14 { top: 88%; left: 55%; animation-duration: 4.3s; animation-delay: 0.9s; }
    .st15 { top: 92%; left: 90%; animation-duration: 3.2s; animation-delay: 1.3s; }

    @keyframes floatStar {
      0%   { transform: translateY(0) rotate(0deg) scale(0.7); opacity: 0.3; }
      50%  { transform: translateY(-18px) rotate(180deg) scale(1.3); opacity: 1; }
      100% { transform: translateY(0) rotate(360deg) scale(0.7); opacity: 0.3; }
    }

    /* Звёздный след за пальцем */
    .trail-star {
      position: fixed;
      pointer-events: none;
      font-size: 16px;
      z-index: 999;
      animation: fadeTrail 0.8s linear forwards;
    }
    @keyframes fadeTrail {
      0% { opacity: 1; transform: scale(1.2) rotate(0deg); }
      100% { opacity: 0; transform: scale(0.2) translateY(-20px) rotate(180deg); }
    }

    /* Закрепленные гирлянды */
    .lights-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 440px;
      padding: 12px 0;
      z-index: 100;
    }
    .lights-bar.top { position: fixed; top: 0; }
    .lights-bar.bottom { position: fixed; bottom: 0; }

    .bulb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      animation: brightGlow 0.9s infinite alternate ease-in-out;
    }
    .bulb:nth-child(1) { animation-delay: 0.0s; background: #ff2a6d; color: #ff2a6d; }
    .bulb:nth-child(2) { animation-delay: 0.15s; background: #ffb703; color: #ffb703; }
    .bulb:nth-child(3) { animation-delay: 0.3s; background: #05ffa1; color: #05ffa1; }
    .bulb:nth-child(4) { animation-delay: 0.45s; background: #00f0ff; color: #00f0ff; }
    .bulb:nth-child(5) { animation-delay: 0.6s; background: #e0aaff; color: #e0aaff; }
    .bulb:nth-child(6) { animation-delay: 0.75s; background: #ff0055; color: #ff0055; }

    @keyframes brightGlow {
      0% { opacity: 0.3; transform: scale(0.8); box-shadow: 0 0 4px currentColor; }
      100% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 70px currentColor; }
    }

    /* Центральный блок */
    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 15px;
      z-index: 10;
      margin: auto 0;
      padding: 50px 0;
    }

    /* Кубики */
    .cubes-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .line {
      display: flex;
      gap: 5px;
      justify-content: center;
      width: 100%;
    }
    
    /* Обёртка для управления свайпом и разлётом */
    .cube-wrapper {
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cube {
      width: clamp(32px, 10vw, 44px);
      height: clamp(32px, 10vw, 44px);
      color: white;
      font-weight: 900;
      font-size: clamp(16px, 5vw, 22px);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6), inset 0 3px 6px rgba(255,255,255,0.8);
      cursor: pointer;
      user-select: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      flex-shrink: 0;
      /* Постоянно подпрыгивают и переливаются цветом */
      animation: animeCube 1.6s infinite alternate ease-in-out;
    }

    .c1 { background: linear-gradient(135deg, #ff007f, #ff758c); animation-delay: 0.0s; }
    .c2 { background: linear-gradient(135deg, #00f0ff, #0072ff); animation-delay: 0.2s; }
    .c3 { background: linear-gradient(135deg, #ffe600, #ff5e00); animation-delay: 0.4s; }
    .c4 { background: linear-gradient(135deg, #05ffa1, #00b894); animation-delay: 0.6s; }
    .c5 { background: linear-gradient(135deg, #ae00ff, #7b2cbf); animation-delay: 0.8s; }

    /* Непрерывная живая анимация кубиков */
    @keyframes animeCube {
      0% {
        filter: hue-rotate(0deg);
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(3deg) scale(1.05);
      }
      100% {
        filter: hue-rotate(180deg);
        transform: translateY(0) rotate(-3deg);
      }
    }

    /* Подсказка */
    .swipe-hint {
      color: rgba(255,255,255,0.75);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: -5px;
      animation: pulseHint 1.5s infinite alternate;
    }
    @keyframes pulseHint {
      0% { opacity: 0.4; transform: translateY(0); }
      100% { opacity: 1; transform: translateY(-3px); }
    }

    /* SMS плашка */
    .messages-container {
      width: 90%;
      max-width: 340px;
      height: 58px;
      position: relative;
    }
    .sms-card {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      padding: 8px 14px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(12px) scale(0.95);
      transition: all 0.4s ease;
    }
    .sms-card.active { opacity: 1; transform: translateY(0) scale(1); }
    .sms-avatar {
      font-size: 22px;
      background: rgba(255,255,255,0.25);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sms-text {
      font-size: 13.5px;
      font-weight: bold;
      line-height: 1.25;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    /* Кнопка музыки */
    .music-btn {
      position: fixed;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.25);
      border: 1.5px solid rgba(255,255,255,0.6);
      color: white;
      font-size: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
    }
  </style>
</head>
<body onclick="startAudio()">

  <button class="music-btn" onclick="toggleMusic(event)">🎵</button>

  <!-- Звёзды по всему экрану -->
  <div class="star st1"></div><div class="star st2"></div><div class="star st3"></div>
  <div class="star st4"></div><div class="star st5"></div><div class="star st6"></div>
  <div class="star st7"></div><div class="star st8"></div><div class="star st9"></div>
  <div class="star st10"></div><div class="star st11"></div><div class="star st12"></div>
  <div class="star st13"></div><div class="star st14"></div><div class="star st15"></div>

  <!-- 1. Верхняя гирлянда -->
  <div class="lights-bar top">
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
  </div>

  <!-- 2. Центральный блок -->
  <div class="main-content">
    <div class="swipe-hint">👈 Свайпни буквы в сторону 👉</div>
    
    <div class="cubes-container">
      <div class="line">
        <div class="cube-wrapper"><div class="cube c1">С</div></div>
        <div class="cube-wrapper"><div class="cube c2">О</div></div>
        <div class="cube-wrapper"><div class="cube c3">Н</div></div>
        <div class="cube-wrapper"><div class="cube c4">Я</div></div>
      </div>
      <div class="line">
        <div class="cube-wrapper"><div class="cube c5">С</div></div>
      </div>
      <div class="line">
        <div class="cube-wrapper"><div class="cube c1">Д</div></div>
        <div class="cube-wrapper"><div class="cube c2">Н</div></div>
        <div class="cube-wrapper"><div class="cube c3">Ё</div></div>
        <div class="cube-wrapper"><div class="cube c4">М</div></div>
      </div>
      <div class="line">
        <div class="cube-wrapper"><div class="cube c5">Р</div></div>
        <div class="cube-wrapper"><div class="cube c1">О</div></div>
        <div class="cube-wrapper"><div class="cube c2">Ж</div></div>
        <div class="cube-wrapper"><div class="cube c3">Д</div></div>
        <div class="cube-wrapper"><div class="cube c4">Е</div></div>
        <div class="cube-wrapper"><div class="cube c5">Н</div></div>
        <div class="cube-wrapper"><div class="cube c1">И</div></div>
        <div class="cube-wrapper"><div class="cube c2">Я</div></div>
      </div>
    </div>

    <div class="messages-container">
      <div class="sms-card active" id="sms">
        <div class="sms-avatar" id="sms-avatar">🎉</div>
        <div class="sms-text" id="sms-text">Сонечка, сияй ярче всех сегодня! ✨</div>
      </div>
    </div>
  </div>

  <!-- 3. Нижняя гирлянда -->
  <div class="lights-bar bottom">
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
    <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
  </div>

  <script>
    const messages = [
      { avatar: '🎉', text: 'Сонечка, сияй ярче всех сегодня! ✨' },
      { avatar: '🎁', text: 'Самых невероятных и крутых приключений!' },
      { avatar: '🌸', text: 'Будь всегда самой счастливой и любимой! ❤️' },
      { avatar: '🎈', text: 'Гору подарков, сладостей и улыбок! 🍰' },
      { avatar: '⭐', text: 'Пусть исполняются абсолютно все мечты!' }
    ];

    let currentIndex = 0;
    function rotateMessages() {
      const card = document.getElementById('sms');
      card.classList.remove('active');

      setTimeout(() => {
        currentIndex = (currentIndex + 1) % messages.length;
        const msg = messages[currentIndex];
        
        document.getElementById('sms-avatar').innerText = msg.avatar;
        document.getElementById('sms-text').innerText = msg.text;

        card.classList.add('active');
      }, 400);
    }
    setInterval(rotateMessages, 2800);

    // --- Свайп эффект ---
    const wrappers = document.querySelectorAll('.cube-wrapper');
    let touchStartX = 0;
    let touchStartY = 0;
    let isExploded = false;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      spawnTrailStar(touchStartX, touchStartY);
    });

    window.addEventListener('touchmove', (e) => {
      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      spawnTrailStar(x, y);

      const diffX = x - touchStartX;
      const diffY = y - touchStartY;

      if (Math.abs(diffX) > 35 || Math.abs(diffY) > 35) {
        if (!isExploded) {
          explodeCubes();
        }
      }
    });

    function spawnTrailStar(x, y) {
      const star = document.createElement('div');
      star.className = 'trail-star';
      star.innerText = '⭐';
      star.style.left = x + 'px';
      star.style.top = y + 'px';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 800);
    }

    function explodeCubes() {
      isExploded = true;
      startAudio();

      wrappers.forEach((wrap) => {
        const randomX = (Math.random() - 0.5) * 320;
        const randomY = (Math.random() - 0.5) * 320;
        const randomRot = (Math.random() - 0.5) * 720;
        wrap.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomRot}deg) scale(0.6)`;
      });

      if (typeof confetti === 'function') {
        confetti({ particleCount: 70, spread: 90, origin: { y: 0.5 } });
      }

      // Собираем обратно
      setTimeout(() => {
        wrappers.forEach((wrap) => {
          wrap.style.transform = 'translate(0px, 0px) rotate(0deg) scale(1)';
        });
        setTimeout(() => { isExploded = false; }, 800);
      }, 1800);
    }

    // Тап по отдельной букве
    wrappers.forEach(wrap => {
      wrap.addEventListener('click', (e) => {
        e.stopPropagation();
        explodeCubes();
      });
    });

    // Музыкальный синтезатор
    let audioCtx = null;
    let isPlaying = false;
    let musicInterval = null;
    let noteIndex = 0;

    const melody = [
      523.25, 523.25, 659.25, 523.25, 783.99, 659.25,
      587.33, 587.33, 698.46, 587.33, 880.00, 783.99,
      523.25, 523.25, 1046.50, 880.00, 783.99, 659.25, 587.33
    ];

    function playNote() {
      if (!isPlaying || !audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      const freq = melody[noteIndex % melody.length];
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);

      noteIndex++;
    }

    function startAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (!isPlaying) {
        isPlaying = true;
        musicInterval = setInterval(playNote, 220);
      }
    }

    function toggleMusic(e) {
      e.stopPropagation();
      if (isPlaying) {
        isPlaying = false;
        clearInterval(musicInterval);
      } else {
        startAudio();
      }
    }
  </script>
</body>
</html>
